<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" width="520" height="170" role="img" aria-label="Wadhwa Solar — make your roof pay the bijli bill" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .ray{transform-origin:78px 80px;animation:spin 22s linear infinite}
  .sun{animation:rise 2.4s cubic-bezier(.22,.7,.25,1) both}
  .w{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.4s .9s ease-out forwards}
  .w2{animation-delay:1.25s}
  .glint{animation:glint 4.5s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes glint{0%,100%{opacity:0}45%{opacity:.9}}
  @media (prefers-reduced-motion:reduce){.ray,.sun,.w,.glint{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
  <!-- brutalist box with hard shadow -->
  <rect x="14" y="20" width="128" height="128" fill="#141414"/>
  <rect x="8" y="14" width="128" height="128" fill="#E9F79A" stroke="#141414" stroke-width="5"/>
  <g clip-path="url(#box)">
    <clipPath id="box"><rect x="8" y="14" width="128" height="128"/></clipPath>
    <g class="sun">
      <g class="ray" stroke="#141414" stroke-width="5" stroke-linecap="round">
        <line x1="78" y1="22" x2="78" y2="34"/><line x1="78" y1="126" x2="78" y2="138"/>
        <line x1="20" y1="80" x2="32" y2="80"/><line x1="124" y1="80" x2="136" y2="80"/>
        <line x1="37" y1="39" x2="45" y2="47"/><line x1="111" y1="113" x2="119" y2="121"/>
        <line x1="119" y1="39" x2="111" y2="47"/><line x1="45" y1="113" x2="37" y2="121"/>
      </g>
      <circle cx="78" cy="80" r="38" fill="#FFD84D" stroke="#141414" stroke-width="5"/>
      <g fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path class="w" d="M55 65 L66 97 L78 74"/>
        <path class="w w2" d="M78 74 L90 97 L101 65"/>
      </g>
    </g>
    <rect class="glint" x="8" y="120" width="128" height="6" fill="#FFFFFF" opacity="0"/>
  </g>
  <text x="168" y="76" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.5" fill="#141414">WADHWA SOLAR</text>
  <rect x="168" y="90" width="250" height="26" fill="#E9F79A" stroke="#141414" stroke-width="2.5"/>
  <text x="178" y="108" font-family="Courier New, monospace" font-size="14" fill="#141414">make your roof pay the bijli bill</text>
</svg>
